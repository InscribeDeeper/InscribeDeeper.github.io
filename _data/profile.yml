sections:
  professional_summary_niw:
    group: professional_summary
    tags: [niw]
    title: Professional Summary
    layout: text
    content: |
      Full-stack software engineer specializing in reliable AI-powered search, retrieval-augmented generation (RAG), enterprise knowledge management, and data integration. Designs and delivers production systems spanning secure conversational AI, multilingual hybrid-search pipelines, recommendation engines, and scalable data infrastructure. Combines software engineering, data science, and applied machine learning to help organizations retrieve trusted information, connect fragmented data, and make complex knowledge more accessible and actionable.

  professional_summary_resume:
    group: professional_summary
    tags: [resume]
    title: Professional Summary
    layout: text
    content: |
      Full-stack software engineer experienced in building production AI, enterprise search, data integration, and personalization systems. Delivers end-to-end solutions using Azure OpenAI, Redis, Weaviate, Elasticsearch, MuleSoft, Java, Python, and JavaScript, with a focus on system reliability, security, and measurable user value.

  professional_summary_cv:
    group: professional_summary
    tags: [cv, all]
    title: Professional Summary
    layout: text
    content: |
      Full-stack software engineer and data science practitioner with experience in production generative AI, enterprise search, natural language processing, recommendation systems, and data integration. Work spans secure RAG applications, multilingual retrieval pipelines, API-based enterprise data synchronization, cloud infrastructure, and applied NLP research. Experienced in translating machine learning methods into reliable systems for industrial and business platforms.

  proposed_endeavor:
    group: proposed_endeavor
    tags: [niw, all]
    title: Proposed Endeavor
    layout: text
    content: |
      Advance reliable, secure, and scalable AI-powered knowledge retrieval and enterprise data integration systems in the United States. This work will focus on production-grade RAG applications, multilingual and hybrid search, recommendation systems, and intelligent automation that enable industrial and business platforms to connect fragmented data, improve access to trusted information, and support more efficient decision-making.

  core_expertise_niw:
    group: core_expertise
    tags: [niw]
    title: Core Expertise
    layout: text
    content: |
      **AI & Knowledge Systems:** Retrieval-augmented generation, conversational AI, agentic workflows, semantic retrieval, reranking, knowledge-base synchronization, and AI safety guardrails

      **Enterprise Search & Data Integration:** Multilingual indexing, hybrid search, query routing and expansion, Elasticsearch, Solr, Weaviate, MuleSoft, and heterogeneous data-source integration

      **Scalable Software Systems:** Full-stack architecture, distributed caching, load balancing, API development, offline data pipelines, cloud infrastructure, monitoring, and performance optimization

      **Applied Machine Learning:** Natural language processing, recommendation systems, text classification, user behavior analysis, experimentation, and feedback-driven quality improvement

  core_expertise_resume:
