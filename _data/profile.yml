# All profile variants live in this file. Each relative path selects section IDs
# from `views` (pick only; no exclusive content). Sections that share a `group`
# are alternatives on normal pages (first selected wins). `/all/` shows every
# section without group dedupe, and annotates titles with path + duplicate tags.
selection:
  strategy: first-section-per-group

about:
  title: About Me
  profile_image: images/wyang_img.jpg
  content: |
    My experience has instilled in me a strong desire to solve difficult challenges with innovative data-driven solutions. I'm enthusiastic about projects that benefit the community, and I'm eager to assist businesses in developing better products by using data to derive insights.

    Stacks:
    - Programming Languages: Python, Java, JavaScript, Shell scripting, SQL
    - Database Management Tools: Elasticsearch, Weaviate, MySQL, Microsoft SQL Server, MongoDB
    - Technology: RAG, Microsoft Azure, Nginx, Adobe Experience Manager, MuleSoft, Docker, AWS, Git, Tableau
    - Python Packages: Pandas, NumPy, PyTorch, Transformers, scikit-learn

