sections:
  professional_summary_niw:
    group: professional_summary
    tags: [niw]
    title: Professional Summary
    layout: text
    content: |
      Full-stack software engineer and data science practitioner focused on reliable AI-powered knowledge retrieval, enterprise search, and data interoperability. My proposed endeavor is to advance secure, scalable, and multilingual retrieval-augmented generation (RAG) and related data-integration systems for industrial and enterprise platforms in the United States. My work combines software engineering, applied machine learning, and production operations to make technical and business knowledge easier to find, evaluate, and use.

  professional_summary_resume:
    group: professional_summary
    tags: [resume]
    title: Professional Summary
    layout: text
    content: |
      Full-stack software engineer experienced in building production AI, enterprise search, data integration, and personalization systems. Delivers end-to-end solutions using Azure OpenAI, Redis, Weaviate, Elasticsearch, MuleSoft, Java, Python, and JavaScript, with a focus on system reliability, security, and measurable user value.

  professional_summary_cv:
    group: professional_summary
    tags: [cv, all]
    title: Professional Summary
    layout: text
    content: |
      Full-stack software engineer and data science practitioner with experience in production generative AI, enterprise search, natural language processing, recommendation systems, and data integration. Work spans secure RAG applications, multilingual retrieval pipelines, API-based enterprise data synchronization, cloud infrastructure, and applied NLP research. Experienced in translating machine learning methods into reliable systems for industrial and business platforms.

  proposed_endeavor:
    group: proposed_endeavor
    tags: [niw, all]
    title: Proposed Endeavor
    layout: text
    content: |
      I propose to advance reliable, secure, and scalable AI-powered knowledge retrieval and enterprise data interoperability in the United States, with an emphasis on industrial and technology platforms. The endeavor is specific: design, implement, evaluate, and continuously improve production systems that:

      - connect technical documentation, product information, partner and location records, content platforms, and other heterogeneous sources;
      - use multilingual indexing, hybrid lexical/semantic retrieval, reranking, query routing, query expansion, and retrieval-augmented generation to return more relevant and traceable information;
      - provide safe conversational and search experiences with access controls, input sanitization, content filtering, PII protection, evaluation workflows, and operational monitoring; and
      - turn retrieval and behavioral signals into practical product support, recommendation, personalization, content, and data-quality capabilities.

      The endeavor is broader than developing one particular application for one employer. It is a continuing engineering and applied-research program to make trusted information more accessible across industrial and enterprise workflows while preserving reliability, security, maintainability, and measurable system quality.

  national_importance_niw:
    group: national_importance
    tags: [niw]
    title: Substantial Merit & Potential National Importance
    layout: text
    content: |
      The proposed endeavor has substantial merit because reliable access to technical and operational information supports product support, industrial services, digital commerce, cybersecurity-readiness workflows, and data-informed business decisions. In these settings, the value of AI is not only generating text; it is connecting authoritative sources, retrieving relevant evidence, controlling unsafe outputs, and making information usable across products, languages, and channels.

      Its potential broader importance comes from the fact that the underlying problems recur across U.S. industrial and enterprise platforms: fragmented data, large technical-document collections, multilingual users, inconsistent metadata, and the need to balance response quality with latency, privacy, and operational reliability. Reusable retrieval, integration, evaluation, and safety methods can therefore be applied across multiple systems and organizations rather than remaining limited to a single user interface.

      My prior work provides concrete examples of this direction in production contexts, including AI-assisted industrial documentation lookup, multilingual retrieval across 10+ sources, and CRM-to-search synchronization through 7+ API workflows. March 2026 usage data recorded approximately 110K unique sessions across the tracked search, retrieval-assistant, and fault-code applications. This figure measures platform activity rather than unique users and should be corroborated by employer or client records in the petition.

  future_work_plan_niw:
    group: future_work_plan
    tags: [niw]
    title: Future Work Plan
    layout: text
    content: |
      I plan to continue advancing this endeavor through four connected workstreams:

      - **Trustworthy retrieval and RAG:** Build retrieval pipelines that combine structured and unstructured data, preserve source context, support multilingual queries, and reduce unsupported or unverifiable responses through grounding and evaluation.
      - **Industrial knowledge and data interoperability:** Connect technical documentation, product and fault-code information, partner/location data, CRM records, content-management systems, and other enterprise sources through maintainable APIs and synchronization workflows.
      - **Safe and scalable production engineering:** Improve access controls, PII protection, content filtering, observability, caching, load balancing, latency, and operational resilience so AI systems can be used in real business and industrial workflows.
      - **Measurement and transfer of methods:** Evaluate relevance, retrieval coverage, response quality, latency, safety, freshness, and user feedback; use the results to improve systems and transfer validated patterns to additional U.S. platforms and collaborators.

      Near-term outputs may include production retrieval and data-integration services, evaluation and monitoring workflows, reusable software components, technical documentation, and cross-functional implementations. The exact employer, product, or collaboration may evolve; the technical objective and the public-facing utility of trustworthy information systems remain consistent.

  well_positioned_niw:
    group: well_positioned
    tags: [niw]
    title: Record of Preparation & Positioning
    layout: text
    content: |
      My background combines the education, research training, production experience, and documented outcomes relevant to this endeavor:

      - **Advanced technical education:** MSc in Data Science from Stevens Institute of Technology (GPA 3.8/4.0), including machine learning, deep learning, natural language processing, statistics, optimization, databases, and web programming; BSc in Mathematics and Applied Mathematics from Guangzhou University.
      - **Applied NLP and machine-learning research:** At Stevens, processed and structured 94,581 earnings-call transcripts to study 96 language factors, achieved 72% accuracy with a domain-adapted BERT classifier, used NLP techniques for text and sentiment analysis, and operated a remote Ubuntu GPU environment for model development.
      - **Production AI and retrieval systems:** At PiSrc, led development of an Azure OpenAI, Redis, and Weaviate agentic chatbot with internal company tools and API integration; built multilingual indexing and hybrid retrieval across 10+ sources; and implemented memory, function calling, content filtering, and PII masking. March 2026 usage data recorded approximately 110K unique sessions across the tracked AI knowledge-assistance applications.
      - **Enterprise interoperability and applied ML:** Designed 7+ MuleSoft workflows for incremental CRM updates, integrated records into Lucidworks Solr and Elasticsearch, and developed recommendation and offline ML pipelines for personalization, interaction modeling, and funnel optimization.
      - **Industrial deployment context:** Delivered or maintained AI-assisted fault-code lookup, search overview, personalization, partner-locator, content-transformation, and content-platform capabilities for industrial digital experiences, with several public product or case-study pages available for corroboration.
      - **Recognition and continued development:** Received the Stevens Provost's Scholarship and the National Mathematical Modeling Contest national second prize; continue to develop business, systems, and data expertise through an MBA program.

      The quantitative results, leadership descriptions, and individual contribution claims above should be supported in the petition record by employment verification, project or client letters, usage reports, technical documentation, recommendation letters, academic records, and award documentation as applicable.

  national_interest_waiver_niw:
    group: waiver_relevance
    tags: [niw]
    title: National-Interest Waiver Relevance
    layout: text
    content: |
      The endeavor is a continuing body of specialized work rather than a single narrowly defined job description. Its progress depends on applying retrieval, integration, safety, and evaluation methods across changing industrial products, enterprise data environments, and collaborative platforms. A flexible employment structure can allow these methods to be developed and applied where the relevant technical problems, data, and implementation opportunities arise, while still producing measurable value for U.S. organizations and users.

      The case for a waiver should be developed from evidence, not from the importance of the occupation alone. Relevant considerations include the prospective reach of the proposed work, the record showing that I can advance it, the need for cross-platform collaboration and continued technical development, and the benefits of allowing the endeavor to continue beyond one fixed position or employer. This profile is a factual professional summary and does not itself make the legal determination that the EB-2 classification or waiver requirements are satisfied.

