    layout: text
    content: |
      **Generative AI & Information Retrieval:** Retrieval-augmented generation, conversational AI, agentic workflows, semantic search, hybrid retrieval, reranking, and AI safety controls

      **Enterprise Platforms & Data:** Multilingual indexing, knowledge management, API integration, Elasticsearch, Solr, Weaviate, Redis, MuleSoft, Adobe Experience Manager, Azure, and AWS

      **Software Engineering:** Python, Java, JavaScript, SQL, REST APIs, distributed caching, load balancing, Docker, Nginx, monitoring, and performance optimization

      **Machine Learning & Analytics:** PyTorch, Hugging Face Transformers, scikit-learn, Pandas, NLP, recommendation systems, text classification, and statistical modeling

