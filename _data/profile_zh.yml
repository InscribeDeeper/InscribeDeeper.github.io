sections:
  professional_summary_niw:
    group: professional_summary
    tags: [niw]
    title: 专业摘要
    layout: text
    content: |
      全栈软件工程师与数据科学实践者，专注于可靠的 AI 驱动知识检索、企业搜索与数据互操作。我的拟议事业是推进面向美国工业与企业平台的安全、可扩展、多语言检索增强生成（RAG）及相关数据集成系统。工作结合软件工程、应用机器学习与生产运维，使技术与业务知识更易发现、评估与使用。

  professional_summary_resume:
    group: professional_summary
    tags: [resume]
    title: 专业摘要
    layout: text
    content: |
      全栈软件工程师，具备构建生产级 AI、企业搜索、数据集成与个性化系统的经验。使用 Azure OpenAI、Redis、Weaviate、Elasticsearch、MuleSoft、Java、Python 与 JavaScript 交付端到端方案，注重系统可靠性、安全性与可衡量的用户价值。

  professional_summary_cv:
    group: professional_summary
    tags: [cv, all]
    title: 专业摘要
    layout: text
    content: |
      全栈软件工程师与数据科学实践者，具备生产级生成式 AI、企业搜索、自然语言处理、推荐系统与数据集成经验。工作覆盖安全 RAG 应用、多语言检索流水线、基于 API 的企业数据同步、云基础设施与应用 NLP 研究。善于将机器学习方法落地为面向工业与商业平台的可靠系统。

  proposed_endeavor:
    group: proposed_endeavor
    tags: [niw, all]
    title: 拟议事业
    layout: text
    content: |
      我拟在美国推进可靠、安全、可扩展的 AI 驱动知识检索与企业数据互操作，重点面向工业与技术平台。该事业目标明确：设计、实现、评估并持续改进能够：

      - 连接技术文档、产品信息、合作伙伴与地点记录、内容平台及其他异构数据源；
      - 利用多语言索引、混合词汇/语义检索、重排序、查询路由、查询扩展与检索增强生成，返回更相关且可追溯的信息；
      - 通过访问控制、输入净化、内容过滤、PII 保护、评估流程与运维监控，提供安全的对话与搜索体验；以及
      - 将检索与行为信号转化为实用的产品支持、推荐、个性化、内容与数据质量能力

      的生产系统。

      该事业不止于为某一雇主开发某一特定应用，而是一项持续的工程与应用研究计划，使可信信息在工业与企业工作流中更易获取，同时保持可靠性、安全性、可维护性与可衡量的系统质量。

  national_importance_niw:
    group: national_importance
    tags: [niw]
    title: 实质价值与潜在国家重要性
    layout: text
    content: |
      拟议事业具有实质价值，因为可靠获取技术与运营信息支撑产品支持、工业服务、数字商务、网络安全准备流程以及数据驱动的业务决策。在这些场景中，AI 的价值不仅在于生成文本，更在于连接权威来源、检索相关证据、管控不安全输出，并使信息可跨产品、语言与渠道使用。

      其潜在更广重要性在于：美国工业与企业平台普遍存在同类问题——数据碎片化、大规模技术文档集合、多语言用户、元数据不一致，以及需要在响应质量与延迟、隐私、运维可靠性之间取得平衡。可复用的检索、集成、评估与安全方法因此可跨多个系统与组织应用，而不限于单一用户界面。

      我过往工作在生产环境中提供了这一方向的具体例证，包括 AI 辅助工业文档查询、跨 10+ 数据源的多语言检索，以及通过 7+ API 工作流实现的 CRM 到搜索同步。2026 年 3 月的使用数据记录，在所追踪的搜索、检索助手与故障代码应用中约有 110K 独立会话。该数字衡量平台活动而非独立用户，申请材料中应以雇主或客户记录加以佐证。

  future_work_plan_niw:
    group: future_work_plan
    tags: [niw]
    title: 未来工作计划
    layout: text
    content: |
      我计划通过四条相互关联的工作线继续推进这一事业：

      - **可信检索与 RAG：** 构建结合结构化与非结构化数据的检索流水线，保留来源上下文，支持多语言查询，并通过 grounding 与评估减少无依据或无法验证的回答。
      - **工业知识与数据互操作：** 通过可维护的 API 与同步工作流，连接技术文档、产品与故障代码信息、合作伙伴/地点数据、CRM 记录、内容管理系统及其他企业数据源。
      - **安全可扩展的生产工程：** 改进访问控制、PII 保护、内容过滤、可观测性、缓存、负载均衡、延迟与运维韧性，使 AI 系统可用于真实业务与工业工作流。
      - **方法的度量与迁移：** 评估相关性、检索覆盖、回答质量、延迟、安全性、新鲜度与用户反馈；用结果改进系统，并将经验证的模式迁移到更多美国平台与合作方。

      近期产出可能包括生产级检索与数据集成服务、评估与监控流程、可复用软件组件、技术文档以及跨职能落地。具体雇主、产品或合作可能演变；可信信息系统的技术目标与面向公众的效用保持一致。

  well_positioned_niw:
    group: well_positioned
    tags: [niw]
    title: 准备与定位记录
    layout: text
    content: |
      我的背景结合了与该事业相关的教育、研究训练、生产经验与可记录成果：

      - **高等技术教育：** 史蒂文斯理工学院数据科学硕士（GPA 3.8/4.0），涵盖机器学习、深度学习、自然语言处理、统计学、优化、数据库与 Web 编程；广州大学数学与应用数学学士。
      - **应用 NLP 与机器学习研究：** 在史蒂文斯处理并结构化 94,581 份财报电话会议记录以研究 96 个语言因子，领域自适应 BERT 分类器达到 72% 准确率，运用 NLP 技术进行文本与情感分析，并运维远程 Ubuntu GPU 环境进行模型开发。
      - **生产级 AI 与检索系统：** 在 PiSrc 主导基于 Azure OpenAI、Redis 与 Weaviate 的智能体聊天机器人开发，集成内部公司工具与 API；构建跨 10+ 数据源的多语言索引与混合检索；实现记忆、函数调用、内容过滤与 PII 掩码。2026 年 3 月使用数据记录，在所追踪的 AI 知识辅助应用中约有 110K 独立会话。
      - **企业互操作与应用 ML：** 设计 7+ 个 MuleSoft 工作流用于 CRM 增量更新，将记录集成到 Lucidworks Solr 与 Elasticsearch，并开发用于个性化、交互建模与漏斗优化的推荐与离线 ML 流水线。
      - **工业部署场景：** 交付或维护 AI 辅助故障代码查询、搜索概览、个性化、合作伙伴定位、内容转换与内容平台能力，服务于工业数字体验，并有若干公开产品或案例页可供佐证。
      - **认可与持续发展：** 获史蒂文斯教务长奖学金与全国大学生数学建模竞赛全国二等奖；通过 MBA 项目继续拓展商业、系统与数据专长。

      上述定量结果、领导职责描述与个人贡献主张，应在申请材料中由雇佣核实、项目或客户函件、使用报告、技术文档、推荐信、学业记录与奖项材料等（视情况）予以支持。

  national_interest_waiver_niw:
    group: waiver_relevance
    tags: [niw]
    title: 国家利益豁免相关性
    layout: text
    content: |
      该事业是持续的专业化工作体系，而非单一狭隘的岗位描述。其进展有赖于在不断变化的工业产品、企业数据环境与协作平台上应用检索、集成、安全与评估方法。灵活的雇佣结构有助于在相关技术问题、数据与实施机会出现之处开发并应用这些方法，同时仍为美国组织与用户创造可衡量价值。

      豁免论证应基于证据构建，而非仅凭职业本身的重要性。相关考量包括拟议工作的前瞻覆盖面、表明我能够推进该事业的记录、跨平台协作与持续技术发展的需要，以及允许该事业超越某一固定岗位或雇主而继续的益处。本档案为事实性专业摘要，本身并不构成对 EB-2 分类或豁免要求是否满足的法律判定。

