      **AI 与知识检索：** 检索增强生成、对话式 AI、智能体工作流、语义检索、混合搜索、重排序、知识库同步、评估与 AI 安全护栏

      **工业信息与数据互操作：** 技术文档与故障代码检索、多语言索引、查询路由与扩展、企业搜索、Elasticsearch、Solr、Weaviate、MuleSoft 与异构数据源集成

      **可扩展生产系统：** 全栈架构、分布式缓存、负载均衡、API 开发、离线数据流水线、云基础设施、监控、安全控制与性能优化

      **应用机器学习：** 自然语言处理、推荐系统、文本分类、用户行为分析、实验与反馈驱动的质量改进

