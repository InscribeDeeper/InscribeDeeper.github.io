{% assign person = site.data.profile.person %}
<div class="container footer-container">
  <p>
    {{ person.name | escape }} -
    <a href="mailto:{{ person.email }}" target="_blank">{{ person.email | escape }}</a>
    {%- if site.footer_show_references -%}
      &nbsp;- {{ site.references_title | default: "References on request" }}
    {%- endif -%}
  </p>
</div>
