services:
  site:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: inscribedeeper-site:latest
    container_name: inscribedeeper-resume-app
    ports:
      - "127.0.0.1:${INSCRIBEDEEPER_PORT:-8510}:80"
    restart: unless-stopped

networks:
  default:
    # 钉死网段（2026-11-21）：从 ~/src/kris-docs/network/docker-subnets.md 领号，
    # 避开 Binghamton VPN / ZeroTier / 家里 LAN 的网段。
    ipam:
      config:
        - subnet: 10.200.15.0/24
          gateway: 10.200.15.1
