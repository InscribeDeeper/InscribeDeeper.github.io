services:
  jekyll:
    build: .
    container_name: modern-resume-theme
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - ./:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      JEKYLL_ENV: development
      BUNDLE_FORCE_RUBY_PLATFORM: "1"

volumes:
  bundle_cache:

networks:
  default:
    # 钉死网段（2026-11-21）：从 ~/src/kris-docs/network/docker-subnets.md 领号，
    # 避开 Binghamton VPN / ZeroTier / 家里 LAN 的网段。
    ipam:
      config:
        - subnet: 10.200.15.0/24
          gateway: 10.200.15.1
